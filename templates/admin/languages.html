{% extends 'admin/base_admin.html' %}
{% block title %}Idiomas{% endblock %}
{% block topbar_title %}Idiomas{% endblock %}
{% block content %}

<div class="card">
  <div class="card-title">➕ Agregar idioma</div>
  <form method="POST">
    <input type="hidden" name="action" value="add"/>
    <div class="form-grid">
      <div class="field"><label>Idioma</label><input type="text" name="lang_name" placeholder="Español"/></div>
      <div class="field"><label>Nivel (es)</label><input type="text" name="level" placeholder="Nativo"/></div>
      <div class="field"><label>Nivel (en)</label><input type="text" name="level_en" placeholder="Native"/></div>
      <div class="field"><label>Orden</label><input type="number" name="sort_order" value="0"/></div>
    </div>
    <button type="submit" class="btn btn-accent" style="margin-top:.75rem">➕ Agregar</button>
  </form>
</div>

<div class="card" style="padding:0">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Idioma</th><th>Nivel (es)</th><th>Nivel (en)</th><th>Orden</th><th>Acciones</th></tr></thead>
      <tbody>
        {% for l in items %}
        <tr>
          <form method="POST">
            <input type="hidden" name="action" value="update"/>
            <input type="hidden" name="id" value="{{ l.id }}"/>
            <td><input type="text" name="lang_name" value="{{ l.lang_name }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/></td>
            <td><input type="text" name="level" value="{{ l.level }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/></td>
            <td><input type="text" name="level_en" value="{{ l.level_en }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/></td>
            <td><input type="number" name="sort_order" value="{{ l.sort_order }}" style="width:60px;padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/></td>
            <td>
              <button type="submit" class="btn btn-ghost btn-sm">💾</button>
            </form>
            <form method="POST" onsubmit="return confirm('¿Eliminar?')" style="display:inline">
              <input type="hidden" name="action" value="delete"/>
              <input type="hidden" name="id" value="{{ l.id }}"/>
              <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
            </form>
            </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
