{% extends 'admin/base_admin.html' %}
{% block title %}Certificaciones{% endblock %}
{% block topbar_title %}Certificaciones{% endblock %}
{% block content %}

<div class="card">
  <div class="card-title">➕ Agregar certificación</div>
  <form method="POST">
    <input type="hidden" name="action" value="add"/>
    <div class="form-grid">
      <div class="field"><label>Nombre (es)</label><input type="text" name="name"/></div>
      <div class="field"><label>Nombre (en)</label><input type="text" name="name_en"/></div>
      <div class="field"><label>Emisor / Detalle</label><input type="text" name="issuer" placeholder="UTN · 66 hs · 2022"/></div>
      <div class="field"><label>Orden</label><input type="number" name="sort_order" value="0"/></div>
    </div>
    <button type="submit" class="btn btn-accent" style="margin-top:.75rem">➕ Agregar</button>
  </form>
</div>

<div class="card" style="padding:0">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Nombre</th><th>Emisor</th><th>Orden</th><th>Acciones</th></tr></thead>
      <tbody>
        {% for cert in items %}
        <tr>
          <td>
            <form method="POST" style="display:contents">
              <input type="hidden" name="action" value="update"/>
              <input type="hidden" name="id" value="{{ cert.id }}"/>
              <div class="form-grid" style="gap:.5rem">
                <input type="text" name="name" value="{{ cert.name }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/>
                <input type="text" name="name_en" value="{{ cert.name_en }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/>
              </div>
          </td>
          <td><input type="text" name="issuer" value="{{ cert.issuer }}" style="padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px;width:100%"/></td>
          <td><input type="number" name="sort_order" value="{{ cert.sort_order }}" style="width:60px;padding:.4rem .6rem;border:1px solid #e5e7eb;border-radius:5px;font-size:13px"/></td>
          <td>
              <button type="submit" class="btn btn-ghost btn-sm">💾</button>
            </form>
            <form method="POST" onsubmit="return confirm('¿Eliminar?')" style="display:inline">
              <input type="hidden" name="action" value="delete"/>
              <input type="hidden" name="id" value="{{ cert.id }}"/>
              <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

{% endblock %}
