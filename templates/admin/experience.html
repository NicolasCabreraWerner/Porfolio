{% extends 'admin/base_admin.html' %}
{% block title %}Experiencia{% endblock %}
{% block topbar_title %}Experiencia laboral{% endblock %}
{% block content %}

<div class="card">
  <div class="card-title">➕ Agregar experiencia</div>
  <form method="POST">
    <input type="hidden" name="action" value="add"/>
    <div class="form-grid">
      <div class="field"><label>Período</label><input type="text" name="years" placeholder="2022 — hoy"/></div>
      <div class="field"><label>Orden</label><input type="number" name="sort_order" value="0" min="0"/></div>
      <div class="field"><label>Empresa (es)</label><input type="text" name="company"/></div>
      <div class="field"><label>Empresa (en)</label><input type="text" name="company_en"/></div>
      <div class="field"><label>Rol (es)</label><input type="text" name="role"/></div>
      <div class="field"><label>Rol (en)</label><input type="text" name="role_en"/></div>
      <div class="field form-full"><label>Descripción (es)</label><textarea name="detail"></textarea></div>
      <div class="field form-full"><label>Descripción (en)</label><textarea name="detail_en"></textarea></div>
    </div>
    <button type="submit" class="btn btn-accent" style="margin-top:.75rem">➕ Agregar</button>
  </form>
</div>

{% for e in items %}
<div class="card">
  <div class="card-title">{{ e.company }} — {{ e.years }}</div>
  <form method="POST">
    <input type="hidden" name="action" value="update"/>
    <input type="hidden" name="id" value="{{ e.id }}"/>
    <div class="form-grid">
      <div class="field"><label>Período</label><input type="text" name="years" value="{{ e.years }}"/></div>
      <div class="field"><label>Orden</label><input type="number" name="sort_order" value="{{ e.sort_order }}" min="0"/></div>
      <div class="field"><label>Empresa (es)</label><input type="text" name="company" value="{{ e.company }}"/></div>
      <div class="field"><label>Empresa (en)</label><input type="text" name="company_en" value="{{ e.company_en }}"/></div>
      <div class="field"><label>Rol (es)</label><input type="text" name="role" value="{{ e.role }}"/></div>
      <div class="field"><label>Rol (en)</label><input type="text" name="role_en" value="{{ e.role_en }}"/></div>
      <div class="field form-full"><label>Descripción (es)</label><textarea name="detail">{{ e.detail }}</textarea></div>
      <div class="field form-full"><label>Descripción (en)</label><textarea name="detail_en">{{ e.detail_en }}</textarea></div>
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.75rem">
      <button type="submit" class="btn btn-primary">💾 Guardar</button>
      <button type="submit" form="del-{{ e.id }}" class="btn btn-danger">🗑️ Eliminar</button>
    </div>
  </form>
  <form id="del-{{ e.id }}" method="POST" onsubmit="return confirm('¿Eliminar esta experiencia?')">
    <input type="hidden" name="action" value="delete"/>
    <input type="hidden" name="id" value="{{ e.id }}"/>
  </form>
</div>
{% endfor %}

{% endblock %}
